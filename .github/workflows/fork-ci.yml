# Fork CI: the gate a feature branch passes before it lands on `develop`.
#
# Flow: feature/* --PR--> develop (this workflow) --> patched (tag --> image).
# Upstream's test.yml only runs on PRs to main and leans on secrets this fork
# does not have, so this file runs the subset that needs no provider
# credentials: the api-slim suite without real-LLM markers, the system tests, ty,
# lint (no diff allowed), the OpenAPI spec, and the control plane. See FORK.md "Branches".
name: Fork CI

on:
  pull_request:
    # ci-base/<tag> is the upstream tag a rebase PR targets, so its diff is only the fork commits.
    branches: [develop, patched, 'ci-base/**']
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: api-tests (${{ matrix.shard }}/3)
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        prune-cache: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Cache hindsight-api-slim/.venv
      uses: actions/cache@v5
      with:
        path: hindsight-api-slim/.venv
        key: ${{ runner.os }}-venv-fork-ci-${{ hashFiles('uv.lock', 'hindsight-api-slim/pyproject.toml', '.python-version') }}

    - name: Install dependencies
      working-directory: ./hindsight-api-slim
      run: uv sync --frozen --all-extras --index-strategy unsafe-best-match

    - name: Cache HuggingFace models
      uses: actions/cache@v5
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-${{ hashFiles('hindsight-api-slim/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-

    - name: Pre-download models
      working-directory: ./hindsight-api-slim
      run: |
        uv run python -c "
        from sentence_transformers import SentenceTransformer, CrossEncoder
        SentenceTransformer('BAAI/bge-small-en-v1.5')
        CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2')
        "

    # Deselected: tests that need credentials this fork's CI does not hold.
    # The fact-extraction ones call a real OpenAI model without a marker
    # (upstream runs them with secrets); the Copilot case needs a signed-in
    # Copilot CLI. They fail the same way on develop with no feature applied.
    - name: Run tests (shard ${{ matrix.shard }}/3)
      working-directory: ./hindsight-api-slim
      # Tests that need credentials or a real LLM; scripts/fork/check.sh reads the same list.
      run: >-
        uv run --with pytest-split pytest tests
        -m "not hs_llm_mat and not hs_llm_core"
        $(sed 's/^/--deselect /' ../scripts/fork/ci-deselect.txt)
        --splits 3 --group ${{ matrix.shard }}

  system-tests:
    # Upstream's test-system job: a real hindsight-api driven through the Python client against a
    # stub LLM, embeddings and rerank server, so it needs no provider credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: system-tests (blackbox)
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        prune-cache: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Install API dependencies
      working-directory: ./hindsight-api-slim
      run: uv sync --frozen --extra embedded-db --index-strategy unsafe-best-match

    - name: Install system-test dependencies
      working-directory: ./hindsight-system-tests
      run: uv sync --frozen

    - name: Run system tests
      working-directory: ./hindsight-system-tests
      run: uv run pytest tests -v

  typecheck-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: ".python-version"

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      run: |
        npm ci
        (cd hindsight-api-slim && uv sync --frozen --all-extras --index-strategy unsafe-best-match)
        (cd hindsight-dev && uv sync --frozen --index-strategy unsafe-best-match)

    - name: ty check (api-slim, all extras)
      working-directory: ./hindsight-api-slim
      run: uv run ty check

    - name: Lint (must leave no diff)
      run: |
        ./scripts/hooks/lint.sh
        git diff --exit-code

    - name: OpenAPI spec is up to date
      working-directory: hindsight-dev
      run: |
        uv run generate-openapi
        git diff --exit-code -- ../hindsight-docs/static/openapi.json

    - name: Fork rebase tooling
      run: bash scripts/fork/rebase-onto.test.sh && bash scripts/fork/review-bundle.test.sh && bash scripts/fork/hook-tests.test.sh && bash scripts/fork/hooked-integrations.test.sh

    - name: Generated docs skill and bank-template schema are up to date
      run: |
        ./scripts/generate-bank-template-schema.sh
        ./scripts/generate-docs-skill.sh
        git status --porcelain
        test -z "$(git status --porcelain)"

  # A `// fork:` hook in an integration package is covered only by that package's own suite.
  hooked-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Typecheck and test every integration carrying a fork hook
      run: |
        pkgs=$(bash scripts/fork/hooked-integrations.sh)
        if [ -z "$pkgs" ]; then echo "none"; exit 0; fi
        for pkg in $pkgs; do
          echo "::group::$pkg"
          (cd "$pkg" && npm ci --no-audit --no-fund && npx tsc --noEmit && CI=true npm test)
          echo "::endgroup::"
        done

  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install and build the TypeScript SDK
      run: |
        npm ci --workspace=hindsight-clients/typescript
        npm run build --workspace=hindsight-clients/typescript

    # Same lightningcss re-install as upstream's build-control-plane job.
    - name: Install Control Plane dependencies
      run: |
        npm install --workspace=hindsight-control-plane
        rm -rf node_modules/lightningcss node_modules/@tailwindcss
        npm install lightningcss @tailwindcss/postcss @tailwindcss/node

    - name: Test
      run: npm test --workspace=hindsight-control-plane

    - name: i18n parity
      run: npm run i18n:check --workspace=hindsight-control-plane

    - name: knip (unused files / dependencies)
      working-directory: hindsight-control-plane
      run: npx --yes knip@5 --no-progress --include files,dependencies,unlisted

    - name: Build
      run: npm run build --workspace=hindsight-control-plane
