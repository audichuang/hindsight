# Builds the patched standalone image (API on 8888 + control plane on 9999) from
# this branch and pushes it to ghcr.io/<owner>/hindsight:<tag>.
#
# It builds the same target as upstream's release.yml for ghcr.io/vectorize-io/hindsight
# (docker/standalone/Dockerfile, target "standalone", default build args, so local ML
# models are included and preloaded), but for linux/amd64 only and with no "latest" tag.
#
# Release: push a lightweight tag like v0.10.3-patch.2 on the patched branch.
#
# Every action is pinned to a full commit SHA (the tag it came from is in the
# comment): this job holds packages: write, so a moved tag must not be able to
# change what gets built or pushed.
name: Build patched image

on:
  push:
    tags:
      - 'v*-patch.*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: patched-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hindsight
  # Base images pinned to the interpreter / runtime versions of the upstream image
  # for this release (0.10.3 ships Python 3.11.17), so a rebuild does not silently
  # move Python or Node. The Dockerfile itself is unchanged; these override its
  # FROM lines through build contexts.
  PYTHON_BASE: python:3.11.17-slim
  NODE_BASE: node:24.21.0-slim

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@36e9a5af4eddb91fc11aec4c6f6f79b3cc0cb523 # main, 2026-10-11
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=long,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/standalone/Dockerfile
          target: standalone
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-contexts: |
            python:3.11-slim=docker-image://${{ env.PYTHON_BASE }}
            node:24-slim=docker-image://${{ env.NODE_BASE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pushed"
            echo
            echo '```'
            printf '%s\n' "$TAGS"
            printf 'digest: %s\n' "$DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
